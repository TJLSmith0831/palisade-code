name = "palisade-updates"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Off by default the config must say so: wrangler re-enables preview URLs on
# every deploy otherwise, and each one is another public endpoint holding the
# same credentials.
preview_urls = false

# Everything here is public config. Tokens are secrets, set with:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put HF_TOKEN
[vars]
GITHUB_REPO = "TJLSmith0831/palisade-code"
# Every key the one universal archive is offered under. darwin-aarch64 stays
# for installs from before the universal build; drop it once none remain.
UPDATE_TARGETS = "darwin-universal darwin-aarch64 darwin-x86_64"

HF_REPO = "TJLSmith0831/palisade-models"

# One line per model role. The app asks for the role it was built for, so a
# second or third model is a new entry here — never a manifest shape change
# that older installs cannot parse.
#   role | file in the HF repo | sha256 | bytes | minimum app version
MODELS = """
fim | Qwen2.5-Coder-0.5B-Q5_K_M.gguf | 59fa334682d4125690371970e07994e47b1c1dd151b8f280fcae019df9eeddfc | 420086272 | 0.2.2
"""

# One issue per 10s per IP. A stuck retry loop files 6/min, not 400.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 1
  period = 10
