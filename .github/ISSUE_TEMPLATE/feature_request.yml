name: Feature request
description: Something Palisade should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where Palisade got in the way. A problem statement helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds, other tools, or a manual process.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fleet board / threads
        - Review lane / merge gate
        - Playbooks
        - Agents / ACP
        - Preview / terminals / editor
        - Completion (local model)
        - Packaging / updates
        - Other
