name: Tester release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tester-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tests never execute the sidecar, but tauri-build requires the declared
      # external binary to exist before it compiles the Rust crate.
      - name: Stub the sidecar for tests
        run: touch src-tauri/llama-server-aarch64-apple-darwin src-tauri/llama-server-x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Validate the version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must look like vX.Y.Z; got $TAG" >&2
            exit 1
          }
          expected="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -1)"
          [[ "$package_version" == "$expected" ]] || { echo "package.json is $package_version, expected $expected" >&2; exit 1; }
          [[ "$tauri_version" == "$expected" ]] || { echo "tauri.conf.json is $tauri_version, expected $expected" >&2; exit 1; }
          [[ "$cargo_version" == "$expected" ]] || { echo "Cargo.toml is $cargo_version, expected $expected" >&2; exit 1; }

      - name: Typecheck and build the frontend
        run: pnpm build

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run Worker tests
        run: node worker/test.mjs

  release:
    name: Build and publish tester release
    needs: verify
    runs-on: macos-15
    environment: testers
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The app ships as one universal binary, so the Rust crate is compiled
      # for both Apple Silicon and Intel and lipo'd by the Tauri CLI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # This is the exact revision reported by the current local sidecar. CI
      # rebuilds it from source rather than copying an untracked local binary.
      #
      # Two slices: the Apple Silicon one uses Metal, the Intel one is
      # CPU-only (Metal compute is unavailable on Intel Macs) and is
      # cross-compiled here with a fixed AVX2 feature set — every Intel Mac
      # that can run macOS 11 has it. GGML_NATIVE would otherwise tune the
      # Intel slice to the ARM host's CPU. The slices are lipo'd into the
      # universal sidecar; all three files are left in place because
      # tauri-build resolves the per-slice name during each `cargo build`
      # and the bundler resolves the universal one.
      - name: Build the bundled llama.cpp sidecar (universal)
        env:
          LLAMA_CPP_REVISION: 308f61c31f083251ce8150f10b9ef97679b500b5 # a shallow fetch needs the full SHA
        run: |
          set -euo pipefail
          git init vendor/llama.cpp
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth=1 origin "$LLAMA_CPP_REVISION"
          git -C vendor/llama.cpp checkout --detach FETCH_HEAD

          # Static and TLS-free: only the llama-server binary ships, so shared libs
          # would be missing at runtime, and the runner's Homebrew OpenSSL is
          # arm64-only (breaks the x86_64 link). The sidecar serves localhost.
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build-arm64 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=ON -DLLAMA_BUILD_SERVER=ON \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF
          cmake --build vendor/llama.cpp/build-arm64 --target llama-server --parallel 3

          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build-x86_64 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DGGML_METAL=OFF -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF
          cmake --build vendor/llama.cpp/build-x86_64 --target llama-server --parallel 3

          install -m 755 vendor/llama.cpp/build-arm64/bin/llama-server \
            src-tauri/llama-server-aarch64-apple-darwin
          install -m 755 vendor/llama.cpp/build-x86_64/bin/llama-server \
            src-tauri/llama-server-x86_64-apple-darwin
          lipo -create \
            src-tauri/llama-server-aarch64-apple-darwin \
            src-tauri/llama-server-x86_64-apple-darwin \
            -output src-tauri/llama-server-universal-apple-darwin

          # The host can only run its own slice; prove the fat file with lipo.
          src-tauri/llama-server-aarch64-apple-darwin --version
          info="$(lipo -info src-tauri/llama-server-universal-apple-darwin)"
          echo "$info"
          grep -q 'x86_64 arm64\|arm64 x86_64' <<<"$info"

      # The model repo is private. Its read token is release-only, just like
      # signing credentials; neither is available to normal CI or local builds.
      - name: Fetch and verify the installer model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_REPOSITORY: TJLSmith0831/palisade-models
          MODEL_FILE: Qwen2.5-Coder-0.5B-Q5_K_M.gguf
          MODEL_SHA256: 59fa334682d4125690371970e07994e47b1c1dd151b8f280fcae019df9eeddfc
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/models
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/$MODEL_REPOSITORY/resolve/main/$MODEL_FILE?download=true" \
            --output "src-tauri/resources/models/$MODEL_FILE"
          printf '%s  %s\n' "$MODEL_SHA256" "src-tauri/resources/models/$MODEL_FILE" | shasum -a 256 --check

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/palisade-signing.keychain-db"
          certificate="$RUNNER_TEMP/palisade-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$certificate"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build signed updater artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          app="$bundle/macos/Palisade.app"
          updater="$(find "$bundle/macos" -type f -name '*.app.tar.gz' -print -quit)"
          [[ -n "$updater" && -f "$updater.sig" ]] || { echo "Missing updater archive or signature" >&2; exit 1; }
          codesign --verify --deep --strict "$app"
          # A universal app is only universal if both the shell and the
          # sidecar carry both slices.
          lipo -info "$app/Contents/MacOS/Palisade" | grep -q 'x86_64 arm64\|arm64 x86_64'
          lipo -info "$app/Contents/MacOS/llama-server" | grep -q 'x86_64 arm64\|arm64 x86_64'
          mkdir -p release-assets
          cp "$updater" "$updater.sig" release-assets/

      - name: Build the model-included installer DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.installer-release.conf.json
          installer_dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          [[ -n "$installer_dmg" ]] || { echo "Missing installer DMG" >&2; exit 1; }
          xcrun notarytool submit "$installer_dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$installer_dmg"
          cp "$installer_dmg" release-assets/

      - name: Verify the distributable installer
        run: |
          set -euo pipefail
          installer_dmg="$(find release-assets -type f -name '*.dmg' -print -quit)"
          mountpoint="$RUNNER_TEMP/palisade-dmg"
          mkdir "$mountpoint"
          hdiutil attach "$installer_dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" -quiet || true; rmdir "$mountpoint" || true' EXIT
          codesign --verify --deep --strict "$mountpoint/Palisade.app"
          spctl -a -vvv -t install "$mountpoint/Palisade.app"
          lipo -info "$mountpoint/Palisade.app/Contents/MacOS/Palisade" | grep -q 'x86_64 arm64\|arm64 x86_64'

      - name: Publish the tester prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes --prerelease --target "$GITHUB_SHA"

      - name: Smoke-test the published update manifest
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail --show-error --retry 3 \
            "https://palisade-updates.tjlsmith0831.workers.dev/latest.json?release=$EXPECTED_VERSION" \
            --output "$RUNNER_TEMP/latest.json"
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/latest.json", "utf8"));
            const expected = process.env.EXPECTED_VERSION.slice(1);
            if (manifest.version !== expected) {
              throw new Error("Published update manifest is not for " + expected);
            }
            // The universal build asks for darwin-universal; installs from
            // the aarch64-only era still ask for darwin-aarch64 and must be
            // offered the same archive, or they never see another update.
            for (const key of ["darwin-universal", "darwin-aarch64", "darwin-x86_64"]) {
              const platform = manifest.platforms?.[key];
              if (!platform?.signature || !platform?.url) {
                throw new Error("Published update manifest does not describe " + key);
              }
            }
          '

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/palisade-signing.p12"
          security delete-keychain "$RUNNER_TEMP/palisade-signing.keychain-db" 2>/dev/null || true
