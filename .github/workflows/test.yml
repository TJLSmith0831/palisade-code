name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # aarch64 runner: the app is aarch64-only, so the sidecar target triple
    # tauri-build resolves has to match what we build for locally.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # No `packageManager` field in package.json, so the version is pinned
      # here instead — action-setup errors out without one.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `llama-server` is a gitignored build input, but tauri-build fails the
      # whole build when an `externalBin` path is missing — before a single
      # test runs. Tests never exec it (they spawn fakes in tempdirs), so an
      # empty file is enough to get past the check.
      - name: Stub the sidecar binary
        run: touch src-tauri/llama-server-aarch64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
