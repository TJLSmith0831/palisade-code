[package]
name = "palisade-code"
version = "0.3.0"
description = "Palisade Code — an Agentic Development Environment that runs ACP coding agents in parallel and gates merge on verification"
authors = ["TJLSmith0831 and the Palisade Code contributors"]
license = "Apache-2.0"
repository = "https://github.com/TJLSmith0831/palisade-code"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "palisade_code_lib"
# This desktop app's binary links this crate as Rust library code (see
# `src/main.rs`). The mobile-only `staticlib` and `cdylib` outputs make every
# debug build retain thousands of large code-generation objects; add them back
# when an iOS or Android target is introduced.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ulid = "1"
chrono = "0.4"
dirs = "6"
# Debug-only: lets the Tauri MCP drive the real app for end-to-end checks.
tauri-plugin-mcp-bridge = "0.12"
portable-pty = "0.9.0"
base64 = "0.23.1"
toml_edit = "0.25.13"
regex = "1.13.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
agent-client-protocol = { version = "2", features = ["unstable_auth_methods"] }
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
gix = "0.86"
# Database viewer/editor: `any` picks the concrete driver per connection URL at
# runtime, so one binary speaks both Postgres and SQLite.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "any",
  "postgres",
  "sqlite",
] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"

# Credential storage. keyring enables no backend by default — every platform
# store is an opt-in feature — so each target names its own. Linux compiles
# none and falls back to the 0600 file path (design.md D15).
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# Release binary is ~3% of the .dmg (the bundled .gguf is 98%), so this is about
# a tidier binary, not download size. strip drops debug symbols; lto + a single
# codegen unit let the optimizer work across the whole crate graph. Costs a
# noticeably slower release build — dev builds are unaffected.
[profile.release]
strip = true
lto = true
codegen-units = 1

# Full DWARF is disproportionately expensive for the large desktop backend.
# Keep file/line data so Rust panics and backtraces remain actionable, while
# avoiding variable and type metadata in the normal dev and test loops.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
